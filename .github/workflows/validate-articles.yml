name: Validate research articles
on:
  push:
    branches: [main, "short-urls-*", "readability-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog, existing articles and publication contract
        run: python scripts/validate_articles.py
      - name: Verify validator regression cases
        run: python scripts/test_validation.py
      - name: Build with the GitHub Pages Jekyll engine
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify published routes, legacy redirects and assets
        run: python scripts/validate_articles.py --site _site
      - name: Check source availability (404 and 410 fail; blocked requests reported)
        run: python scripts/validate_articles.py --links --report /tmp/dekrov-link-report.json
      - name: Retain built site for preview validation
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-availability
          path: /tmp/dekrov-link-report.json
          if-no-files-found: ignore
