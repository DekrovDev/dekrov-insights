<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">BEFORE / A CLAIM ALONE</title><desc id="desc">Claim: “A new version fixes the problem.”; Missing context: Which version? Which problem?; Reader: Cannot check scope or limitations.</desc><rect width="640" height="420" fill="white"/><g font-family="Arial, sans-serif" fill="#111"><text x="28" y="43" font-size="22" font-weight="bold">BEFORE / A CLAIM ALONE</text><text x="28" y="74" font-size="14" fill="#555">Illustrative workflow, not a real incident</text><rect x="28" y="112" width="584" height="76" rx="2" fill="#f4f4f4" stroke="#b5b5b5"/><text x="46" y="139" font-size="16" font-weight="bold">Claim</text><text x="46" y="165" font-size="14">“A new version fixes the problem.”</text><rect x="28" y="206" width="584" height="76" rx="2" fill="#f4f4f4" stroke="#b5b5b5"/><text x="46" y="233" font-size="16" font-weight="bold">Missing context</text><text x="46" y="259" font-size="14">Which version? Which problem?</text><rect x="28" y="300" width="584" height="76" rx="2" fill="#f4f4f4" stroke="#b5b5b5"/><text x="46" y="327" font-size="16" font-weight="bold">Reader</text><text x="46" y="353" font-size="14">Cannot check scope or limitations.</text></g></svg>
