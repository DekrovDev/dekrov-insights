<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><title>Conceptual MiniMax MoE flow</title><desc>A request enters a large context window, sparse attention selects a subset of experts for text generation, and a textual answer emerges. The drawing is a conceptual simplification.</desc><rect width="1000" height="420" rx="24" fill="#111827"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="55" y="68" font-size="26" font-weight="bold">How a big MoE model can be efficient</text><text x="55" y="102" font-size="16" fill="#94a3b8">Conceptual, not a model implementation diagram</text><rect x="54" y="145" width="211" height="148" rx="15" fill="#273649" stroke="#94a3b8"/><text x="79" y="201" font-size="23" font-weight="bold">Request</text><text x="79" y="234" font-size="16">Text / image / video</text><text x="79" y="261" font-size="15" fill="#c7d2fe">Up to 1M context</text><path d="M275 219 H365" stroke="#a5b4fc" stroke-width="6"/><path d="M349 209 l17 10 -17 10" stroke="#a5b4fc" stroke-width="5" fill="none"/><rect x="381" y="145" width="277" height="148" rx="15" fill="#193e42" stroke="#6ee7b7"/><text x="407" y="196" font-size="22" font-weight="bold">Sparse attention</text><text x="407" y="229" font-size="20">Expert routing</text><text x="407" y="262" font-size="16" fill="#a7f3d0">~23B active / token</text><path d="M670 219 H746" stroke="#a5b4fc" stroke-width="6"/><path d="M730 209 l17 10 -17 10" stroke="#a5b4fc" stroke-width="5" fill="none"/><rect x="762" y="145" width="184" height="148" rx="15" fill="#392957" stroke="#c4b5fd"/><text x="792" y="201" font-size="22" font-weight="bold">Text output</text><text x="792" y="239" font-size="16" fill="#ddd6fe">Reasoning</text><text x="55" y="350" font-size="18">~428B total parameters is not ~428B computed per token.</text><text x="55" y="383" font-size="16" fill="#94a3b8">Fast tokens / second != fast end-to-end agent task.</text></g></svg>